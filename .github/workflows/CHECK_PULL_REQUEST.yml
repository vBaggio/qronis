name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: build/jacoco/test.exec
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit
          path: build/test-results/test/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Upload JaCoCo execution data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration
          path: build/jacoco/integrationTest.exec
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-integration
          path: build/test-results/integrationTest/

  coverage:
    name: Coverage Gate (≥90%)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile production classes
        run: ./gradlew compileJava

      - name: Download unit test execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-unit
          path: build/jacoco/

      - name: Download integration test execution data
        uses: actions/download-artifact@v4
        with:
          name: jacoco-integration
          path: build/jacoco/

      - name: Generate JaCoCo report and verify threshold
        run: ./gradlew jacocoTestReport jacocoCoverageVerification

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
